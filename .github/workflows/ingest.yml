#
# Ingest releases into UNSIGNED candidates (A§5.1, A§5.2; lib/ingest.mjs),
# under the PULL model (lane C design §0 finding 1, §1.3, §1.9).
#
# The plugins service holds no GitHub credential (contract OD-12): its
# waker can only dispatch this workflow with {"ref":"main"} and NO inputs
# (INV-33), so nothing arrives with the event. Three jobs:
#
#   work    leases up to 5 releases from the service (POST bot/games/leases),
#           polls the repositories it names and registers what it found
#           (POST bot/games/releases), and writes one games-request-<lease>.json
#           per lease. Environment `games-service` (no secrets); its only
#           credential is a GitHub OIDC token for the service's audience.
#   ingest  one matrix leg per lease. It reads a stranger's release, so it
#           holds NO secret: no environment, no `secrets.` reference, a token
#           that can only read. It cannot sign, commit or push; its whole
#           output is the candidate, uploaded as games-candidate-<lease>,
#           which sign.yml re-validates before any key is involved.
#   report  posts astra.games.ingest-result/1 per lease (POST
#           bot/games/ingest-results). Environment `games-service`, OIDC only.
#
# test/workflows.test.mjs fails the build if any of that stops being true.
# Nothing the service answered is interpolated into a `run:` line: it is
# written to files, and the lease ids reach a script through `env:` only.

name: Ingest

on:
  workflow_dispatch:
  schedule:
    # the fallback when the waker is down; a lease lives 30 minutes
    - cron: "*/15 * * * *"

permissions: {}

jobs:
  work:
    name: Lease releases from the plugins service
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: games-service
    permissions:
      contents: read
      id-token: write   # an OIDC token whose audience the service pins; no secret
    outputs:
      leases: ${{ steps.lease.outputs.leases }}
      malformed: ${{ steps.lease.outputs.malformed }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GAMES_SERVICE_URL: ${{ vars.GAMES_SERVICE_URL }}
      GAMES_SERVICE_AUDIENCE: ${{ vars.GAMES_SERVICE_AUDIENCE }}
    steps:
      - name: Check out the catalogue's code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Lease, poll and register
        id: lease
        run: node bin/service.mjs ingest-work --out "$RUNNER_TEMP/requests"

      - name: Keep the requests for the ingest jobs
        if: steps.lease.outputs.leases != '[]'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-requests
          path: ${{ runner.temp }}/requests
          if-no-files-found: error
          retention-days: 1

  ingest:
    name: Ingest one release
    needs: work
    if: needs.work.outputs.leases != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lease: ${{ fromJSON(needs.work.outputs.leases) }}
    permissions:
      contents: read
    env:
      # The job's own read-only token: GitHub's API rate limit and
      # `gh attestation verify` on a public repository. Not a signing secret.
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      LEASE: ${{ matrix.lease }}
    steps:
      - name: Check out the catalogue's code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the catalogue's state (data), read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: catalogue-data
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Fetch this lease's request
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: games-requests
          path: ${{ runner.temp }}/requests

      - name: Install the pinned gi-probe (none yet; ingest then waits)
        run: node bin/fetch-gi-probe.mjs --dir "$RUNNER_TEMP/bin"

      - name: Ingest
        run: node bin/ingest.mjs --data catalogue-data --request "$RUNNER_TEMP/requests/games-request-$LEASE.json" --lease "$LEASE" --out "$RUNNER_TEMP/out/candidate.json"

      - name: Keep the candidate for the report and the signer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: games-candidate-${{ matrix.lease }}
          path: ${{ runner.temp }}/out/candidate.json
          if-no-files-found: error
          retention-days: 7

  report:
    name: Report each lease's result to the plugins service
    needs: [work, ingest]
    # a broken ingest leg must not silence the others' results
    if: always() && needs.work.result == 'success' && needs.work.outputs.leases != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: games-service
    permissions:
      contents: read
      id-token: write   # an OIDC token whose audience the service pins; no secret
    env:
      GAMES_SERVICE_URL: ${{ vars.GAMES_SERVICE_URL }}
      GAMES_SERVICE_AUDIENCE: ${{ vars.GAMES_SERVICE_AUDIENCE }}
      LEASES: ${{ needs.work.outputs.leases }}
      MALFORMED: ${{ needs.work.outputs.malformed }}
    steps:
      - name: Check out the catalogue's code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Fetch every candidate of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: games-candidate-*
          path: ${{ runner.temp }}/candidates

      - name: Report
        run: node bin/service.mjs ingest-report --candidates "$RUNNER_TEMP/candidates"
