#
# The daily re-sign (A§5.3: "re-signed daily and on every change"). A copy
# expires 7 days after issue and clients stop new installs and updates on an
# expired copy, so both documents are re-signed every day, well before
# expiry, whether or not anything changed; takedowns the 24-hour bound held
# are admitted on the way. Same environment and secrets as sign.yml, and the
# same concurrency group, so the two never race on the `data` branch.

name: Resign

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-games
  cancel-in-progress: false

jobs:
  resign:
    name: Re-sign both documents
    # Nothing is signed before the games service is live and the kind keys
    # exist; the daily schedule SKIPS until GAMES_LIVE is "true" (see
    # ingest.yml). A manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.GAMES_LIVE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: publish-games
    permissions:
      contents: read    # `data` is pushed with the deploy key (bin/push-data.sh), never GITHUB_TOKEN
    steps:
      - name: Check out the catalogue's code (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check out the catalogue's state (data)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: catalogue-data
          persist-credentials: false

      - name: Check out the published trust.json (astra-registry; verified under the compiled roots)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mihailinl/astra-registry
          ref: main
          path: registry
          sparse-checkout: registry/v1/trust.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Re-sign
        id: sign
        env:
          GAMES_SIGNING_KEY_CURRENT: ${{ secrets.GAMES_SIGNING_KEY_CURRENT }}
          GAMES_SIGNING_KEY_NEXT: ${{ secrets.GAMES_SIGNING_KEY_NEXT }}
        run: node bin/resign.mjs --data catalogue-data --trust registry/registry/v1/trust.json

      - name: Push the documents to `data`
        env:
          ISSUED_AT: ${{ steps.sign.outputs.issued_at }}
          KEY_ID: ${{ steps.sign.outputs.key_id }}
          GAMES_DATA_DEPLOY_KEY: ${{ secrets.GAMES_DATA_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          bin/push-data.sh catalogue-data "resign: issued_at $ISSUED_AT under $KEY_ID"
